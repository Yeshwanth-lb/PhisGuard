server {
    listen 80 default_server;
    listen [::]:80 default_server;

    access_log off;
    log_not_found off;
    error_log  /dev/stderr error;

    # Redirect to HTTPS on the externally-mapped port 8443.
    # $host strips the port — hardcode :8443 so the browser lands correctly.
    return 301 https://localhost:8443$request_uri;
}
