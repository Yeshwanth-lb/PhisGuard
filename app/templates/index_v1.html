<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PhishGuard Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}
header{background:linear-gradient(135deg,#1a1f2e,#0f1117);border-bottom:1px solid #2d3748;padding:18px 32px;display:flex;align-items:center;gap:12px}
.logo{font-size:22px;font-weight:700;color:#63b3ed;letter-spacing:-.5px}
.logo span{color:#fc8181}
.container{max-width:900px;margin:40px auto;padding:0 20px}
.card{background:#1a1f2e;border:1px solid #2d3748;border-radius:12px;padding:28px;margin-bottom:24px}
.card h2{font-size:16px;font-weight:600;color:#a0aec0;text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px}
textarea{width:100%;min-height:180px;background:#0f1117;border:1px solid #2d3748;border-radius:8px;padding:14px;color:#e2e8f0;font-family:monospace;font-size:13px;resize:vertical;outline:none;transition:border-color .2s}
textarea:focus{border-color:#63b3ed}
textarea::placeholder{color:#4a5568}
.btn-row{display:flex;gap:12px;margin-top:16px;align-items:center}
button{padding:10px 24px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.bp{background:#3182ce;color:white}.bp:hover{background:#2b6cb0}.bp:disabled{background:#2d3748;color:#4a5568;cursor:not-allowed}
.bs{background:#2d3748;color:#a0aec0}.bs:hover{background:#4a5568}
.spin{display:none;width:18px;height:18px;border:2px solid #2d3748;border-top-color:#63b3ed;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rc{display:none;border-radius:12px;padding:28px;margin-bottom:24px;border:1px solid}
.rc.phishing{background:#2d1515;border-color:#c53030}
.rc.suspicious{background:#2d2415;border-color:#c05621}
.rc.clean{background:#142d1f;border-color:#276749}
.rc.error{background:#1a1f2e;border-color:#4a5568}
.vh{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.vi{font-size:36px}
.vt{font-size:26px;font-weight:800;letter-spacing:-.5px}
.phishing .vt{color:#fc8181}.suspicious .vt{color:#f6ad55}.clean .vt{color:#68d391}
.vs{font-size:13px;color:#a0aec0;margin-top:2px}
.cb{background:#0f1117;border-radius:8px;height:8px;margin:12px 0 20px;overflow:hidden}
.cf{height:100%;border-radius:8px;transition:width .8s ease}
.phishing .cf{background:#fc8181}.suspicious .cf{background:#f6ad55}.clean .cf{background:#68d391}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}
.db{background:rgba(0,0,0,.3);border-radius:8px;padding:12px 16px}
.db .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#718096;margin-bottom:4px}
.db .val{font-size:15px;font-weight:600;color:#e2e8f0}
.es{margin-top:20px}
.es h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#718096;margin-bottom:12px}
.er{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.en{width:110px;font-size:13px;color:#a0aec0}
.ebw{flex:1;background:#0f1117;border-radius:4px;height:6px;overflow:hidden}
.eb{height:100%;border-radius:4px;background:#63b3ed;transition:width .8s ease}
.ev{width:40px;text-align:right;font-size:12px;color:#718096;font-family:monospace}
.sr{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.sb{background:#1a1f2e;border:1px solid #2d3748;border-radius:10px;padding:18px;text-align:center}
.sb .num{font-size:28px;font-weight:800;color:#63b3ed}
.sb .lb{font-size:12px;color:#718096;margin-top:4px}
.ht{width:100%;border-collapse:collapse;font-size:13px}
.ht th{text-align:left;padding:8px 12px;color:#718096;font-size:11px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid #2d3748}
.ht td{padding:10px 12px;border-bottom:1px solid #1a1f2e;color:#a0aec0}
.bv{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase}
.bv.phishing{background:#c53030;color:#fff5f5}.bv.suspicious{background:#c05621;color:#fffaf0}.bv.clean{background:#276749;color:#f0fff4}
.nh{text-align:center;padding:32px;color:#4a5568;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="logo">Phish<span>Guard</span></div>
  <div style="flex:1"></div>
  <div style="font-size:13px;color:#4a5568">AI-Powered Email Security</div>
</header>
<div class="container">
<div class="sr">
<div class="sb"><div class="num" id="st">0</div><div class="lb">Total Emails</div></div>
<div class="sb"><div class="num" style="color:#fc8181" id="sp">0</div><div class="lb">Phishing Found</div></div>
<div class="sb"><div class="num" style="color:#f6ad55" id="ss">0</div><div class="lb">Suspicious</div></div>
<div class="sb"><div class="num" style="color:#68d391" id="sc">0</div><div class="lb">Clean</div></div>
</div>
<div class="card">
<h2>Submit Email for Review</h2>
<textarea id="ei" placeholder="Paste the raw email here including headers..."></textarea>
<div class="btn-row">
<button class="bp" id="sb2" onclick="runScan()">Check Email</button>
<button class="bs" onclick="loadDemo()">Load Demo</button>
<button class="bs" onclick="resetForm()">Clear</button>
<div class="spin" id="spn"></div>
<span id="msg" style="font-size:13px;color:#718096"></span>
</div></div>
<div class="rc" id="rc">
<div class="vh"><div class="vi" id="ri"></div>
<div><div class="vt" id="rv"></div><div class="vs" id="rs"></div></div>
<div style="flex:1"></div>
<div style="text-align:right"><div style="font-size:28px;font-weight:800" id="rconf"></div>
<div style="font-size:12px;color:#718096">Confidence</div></div></div>
<div class="cb"><div class="cf" id="rb" style="width:0%"></div></div>
<div class="dg">
<div class="db"><div class="lbl">Blocked At</div><div class="val" id="rl">-</div></div>
<div class="db"><div class="lbl">Email ID</div><div class="val" id="rid" style="font-size:11px;font-family:monospace">-</div></div>
<div class="db"><div class="lbl">Scan Time</div><div class="val" id="rt">-</div></div>
</div>
<div class="es" id="ens" style="display:none">
<h3>AI Engine Scores</h3>
<div class="er"><div class="en">Structural</div><div class="ebw"><div class="eb" id="b-s" style="width:0%"></div></div><div class="ev" id="v-s">0.00</div></div>
<div class="er"><div class="en">NLP (Claude)</div><div class="ebw"><div class="eb" id="b-n" style="width:0%"></div></div><div class="ev" id="v-n">0.00</div></div>
<div class="er"><div class="en">Behavioral</div><div class="ebw"><div class="eb" id="b-b" style="width:0%"></div></div><div class="ev" id="v-b">0.00</div></div>
</div></div>
<div class="card"><h2>Recent History</h2>
<div id="hb"><div class="nh">No results yet - submit an email above.</div></div>
</div></div>
<script>
const API='http://localhost:8000';
let token=null,log=[],stats={t:0,p:0,s:0,c:0};
async function getToken(){
  if(token)return token;
  try{const r=await fetch(API+'/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:'dev-key'})});
  const d=await r.json();token=d.access_token;}catch(e){}
  return token;
}
async function runScan(){
  const raw=document.getElementById('ei').value.trim();
  if(!raw){alert('Paste an email first.');return;}
  setBusy(true);hideResult();
  try{
    const tok=await getToken();
    const t0=Date.now();
    const hdrs={'Content-Type':'application/json'};
    if(tok)hdrs['Authorization']='Bearer '+tok;
    const r=await fetch(API+'/analyze',{method:'POST',headers:hdrs,body:JSON.stringify({raw_email:raw})});
    const ms=Date.now()-t0;
    if(!r.ok){const e=await r.json();showErr(e.detail||'Error '+r.status);return;}
    const d=await r.json();d._ms=ms;
    showOK(d);pushLog(d);bump(d.verdict);
  }catch(e){showErr('Cannot reach server. Run: python -m uvicorn app.main:app --reload');}
  finally{setBusy(false);}
}
function showOK(d){
  const card=document.getElementById('rc');
  const v=(d.verdict||'unknown').toLowerCase();
  const pct=Math.round((d.confidence||0)*100);
  card.className='rc '+v;card.style.display='block';
  const icons={phishing:'🚨',suspicious:'⚠️',clean:'✅',unknown:'❓'};
  document.getElementById('ri').textContent=icons[v]||'❓';
  const labels={phishing:'PHISHING DETECTED',suspicious:'SUSPICIOUS EMAIL',clean:'CLEAN EMAIL',unknown:'UNKNOWN'};
  document.getElementById('rv').textContent=labels[v]||v.toUpperCase();
  const subs={phishing:'This email is a phishing attempt. Do not click any links.',
              suspicious:'Suspicious patterns detected. Be cautious.',
              clean:'No threats found. This email appears safe.',
              unknown:'Could not determine result.'};
  document.getElementById('rs').textContent=subs[v]||'';
  document.getElementById('rconf').textContent=pct+'%';
  document.getElementById('rb').style.width=pct+'%';
  document.getElementById('rl').textContent=d.blocked_at||'all layers passed';
  document.getElementById('rid').textContent=d.email_id||'-';
  document.getElementById('rt').textContent=(d._ms||0)+' ms';
  const l2=d.l2;
  if(l2&&l2.engine_scores){
    const sc=l2.engine_scores;
    document.getElementById('ens').style.display='block';
    [['s','structural'],['n','nlp'],['b','behavioral']].forEach(([k,name])=>{
      const val=sc[name]||0;
      document.getElementById('b-'+k).style.width=Math.round(val*100)+'%';
      document.getElementById('v-'+k).textContent=val.toFixed(2);
    });
  }else{document.getElementById('ens').style.display='none';}
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function showErr(msg){
  const card=document.getElementById('rc');
  card.className='rc error';card.style.display='block';
  document.getElementById('ri').textContent='❌';
  document.getElementById('rv').textContent='ERROR';
  document.getElementById('rs').textContent=msg;
  document.getElementById('rconf').textContent='';
  document.getElementById('rb').style.width='0%';
  document.getElementById('ens').style.display='none';
}
function hideResult(){document.getElementById('rc').style.display='none';}
function pushLog(d){
  const v=d.verdict||'unknown';
  const pct=Math.round((d.confidence||0)*100);
  log.unshift({id:d.email_id,v,pct,time:new Date().toLocaleTimeString(),layer:d.blocked_at||'-'});
  if(log.length>20)log.pop();
  renderLog();
}
function renderLog(){
  if(!log.length)return;
  const rows=log.map(x=>`<tr><td><span class="bv ${x.v}">${x.v}</span></td><td>${x.pct}%</td><td>${x.layer}</td><td>${x.time}</td><td style="font-size:11px;color:#4a5568">${x.id?x.id.slice(0,8):'-'}</td></tr>`).join('');
  document.getElementById('hb').innerHTML=`<table class="ht"><thead><tr><th>Verdict</th><th>Confidence</th><th>Blocked At</th><th>Time</th><th>ID</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function bump(v){
  stats.t++;
  if(v==='phishing')stats.p++;else if(v==='suspicious')stats.s++;else stats.c++;
  document.getElementById('st').textContent=stats.t;
  document.getElementById('sp').textContent=stats.p;
  document.getElementById('ss').textContent=stats.s;
  document.getElementById('sc').textContent=stats.c;
}
function setBusy(on){
  document.getElementById('sb2').disabled=on;
  document.getElementById('spn').style.display=on?'block':'none';
  document.getElementById('msg').textContent=on?'Checking...':'';
}
function resetForm(){document.getElementById('ei').value='';hideResult();}
function loadDemo(){
  document.getElementById('ei').value=[
    'From: security-alert@paypa1.com',
    'To: user@company.com',
    'Subject: URGENT: Account needs immediate attention',
    'Date: Sun, 14 Jun 2026 07:30:00 +0000',
    '','Dear Customer,','',
    'We detected unusual login activity on your account.',
    '','Click the link below to restore access:',
    'http://paypa1-secure-login.xyz/verify?session=abc123',
    '','You have 24 hours before permanent closure.','','Security Team'
  ].join('\n');
}
</script>
</body>
</html>
